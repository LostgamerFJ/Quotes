<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Login-Secrets erzeugen</title>
</head>
<body style="font-family: sans-serif; max-width: 600px; margin: 2rem auto;">

<h1>Login-Secrets erzeugen</h1>
<p>
  Dieses Tool läuft nur lokal in deinem Browser, es sendet nichts ans Internet.
  Es erzeugt die beiden Werte, die du als Worker-Secrets <code>LOGIN_SALT</code>
  und <code>LOGIN_HASH</code> anlegen musst.
</p>

<label>Gewünschtes Passwort: <input id="password" type="password"></label><br><br>
<button onclick="generateSecrets()">Werte erzeugen</button>

<h3>LOGIN_SALT:</h3>
<input id="saltResult" style="width: 100%;" readonly>

<h3>LOGIN_HASH:</h3>
<input id="hashResult" style="width: 100%;" readonly>

<script>
const PBKDF2_ITERATIONS = 100000;

function bufToHex(buf) {
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
}

async function hashPassword(password, saltBytes) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    "raw", enc.encode(password), "PBKDF2", false, ["deriveBits"]
  );
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: saltBytes, iterations: PBKDF2_ITERATIONS, hash: "SHA-256" },
    keyMaterial,
    256
  );
  return bufToHex(bits);
}

async function generateSecrets() {
  const password = document.getElementById("password").value;
  if (!password) {
    alert("Bitte ein Passwort eingeben.");
    return;
  }

  const saltBytes = crypto.getRandomValues(new Uint8Array(16));
  const salt = bufToHex(saltBytes.buffer);
  const hash = await hashPassword(password, saltBytes);

  document.getElementById("saltResult").value = salt;
  document.getElementById("hashResult").value = hash;
}
</script>

</body>
</html>
