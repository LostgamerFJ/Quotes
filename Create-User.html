<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Nutzer für Users.json erzeugen</title>
</head>
<body style="font-family: sans-serif; max-width: 600px; margin: 2rem auto;">

<h1>Nutzer erzeugen</h1>
<p>
  Dieses Tool läuft nur lokal in deinem Browser. Es sendet nichts ans Internet.
  Es erzeugt einen Eintrag, den du von Hand in deine <code>Users.json</code> auf
  OX Drive einträgst (einmalig, zum Start).
</p>

<label>Nutzername: <input id="username" value="felix"></label><br><br>
<label>Rolle:
  <select id="role">
    <option value="admin">admin</option>
    <option value="user">user</option>
    <option value="guest">guest</option>
  </select>
</label><br><br>
<label>Passwort: <input id="password" type="password"></label><br><br>
<button onclick="generateEntry()">Eintrag erzeugen</button>

<h3>Ergebnis (in Users.json einfügen):</h3>
<textarea id="result" rows="8" style="width: 100%;" readonly></textarea>

<script>
const PBKDF2_ITERATIONS = 100000;

function bufToHex(buf) {
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
}

async function hashPassword(password, saltBytes) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    "raw", enc.encode(password), "PBKDF2", false, ["deriveBits"]
  );
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: saltBytes, iterations: PBKDF2_ITERATIONS, hash: "SHA-256" },
    keyMaterial,
    256
  );
  return bufToHex(bits);
}

async function generateEntry() {
  const username = document.getElementById("username").value.trim();
  const role = document.getElementById("role").value;
  const password = document.getElementById("password").value;

  if (!username || !password) {
    alert("Bitte Nutzername und Passwort ausfüllen.");
    return;
  }

  const saltBytes = crypto.getRandomValues(new Uint8Array(16));
  const salt = bufToHex(saltBytes.buffer);
  const hash = await hashPassword(password, saltBytes);

  const entry = { username, role, salt, hash };
  document.getElementById("result").value = JSON.stringify(entry, null, 2) + ",";
}
</script>

</body>
</html>
