<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Zitate</title>
        <link rel="icon" type="image/png" href="assets/Icon.png">
        <link rel="stylesheet" href="style.css">
    </head>
    <body data-role="User">
        <div id="login" class="login active">
            <label for="password">Passwort:</label>
            <input type="password" id="password" name="password" required>
            <button id="loginBtn">OK</button>
        </div>

        <div id="loggedIn" class="loggedIn">
            <div id="categoryThingy">
                <div class="category">
                    <p class="category-label">Lehrende</p>
                    <div id="TeacherCollapsibles"></div>
                </div>

                <div class="category">
                    <p class="category-label">Schüler*innen</p>
                    <div id="StudentCollapsibles"></div>
                </div>
            </div>

            <div id="bottom">
                <button id="newQuoteBtn">Neues Zitat</button>
                <button id="saveAllBtn">Speichern</button>
                <button id="ToggleDebug">ToggleDebug</button>
                <!--<button id="DemoBtn">DEMO</button>-->
                <button id="tempBtn">Temp</button>
            </div>
        </div>

        
        
        

        <!--TEMPLATES-->

        <template id="line-template">
            <div class="field-line field-line-quote" id="field-line-PLACEHOLDER">

                <div class="field field-person active">
                    <label>Person</label>
                    <div class="person-dropdown-slot" id="personSlot-PLACEHOLDER"></div>
                </div>

                <div class="field-container">

                    <div class="field field-before active">
                        <label for="Before-PLACEHOLDER">Text Davor</label>
                        <div class="wrapper wrapper-before">
                            <textarea class="wrapper-textarea" rows="1" id="Before-PLACEHOLDER" placeholder="Optional"></textarea>
                            <button type="button" class="toggle" data-location="before">( )</button>
                        </div>
                    </div>

                    <div class="field field-quote active">
                        <label for="Quote-PLACEHOLDER">Zitat</label>
                        <textarea rows="1" id="Quote-PLACEHOLDER"></textarea>
                    </div>

                    <div class="field field-after active">
                        <label for="After-PLACEHOLDER">Text Danach</label>
                        <div class="wrapper wrapper-after">
                            <textarea class="wrapper-textarea" rows="1" id="After-PLACEHOLDER" placeholder="Optional"></textarea>
                            <button type="button" class="toggle" data-location="after">( )</button>
                        </div>
                    </div>
                    
                </div>
            </div>
        </template>

        <template id="collapsible-template">
            <div class="FullColl">
                <div class="collapsible" id="collapsible-PLACEHOLDER">
                    <img class="person-avatar"height="50">
                    <p class="name">PLACEHOLDER</p>
                    <p class="quoteCount">PLACEHOLDER</p>
                    <img class="arrow" src="https://cdn-icons-png.flaticon.com/512/54/54817.png" height="10" style="margin-left: 10px; transform: rotate(180deg)" id="arrow-PLACEHOLDER">
                </div>
                <div class="content" id="quotes-PLACEHOLDER"></div>
            </div>
        </template>

        <template id="person-dropdown-template">
            <div class="person-dropdown" id="personDropdown-PLACEHOLDER" data-selected-id="">
                <div class="person-dropdown-toggle">
                    <img class="person-dropdown-avatar" src="" alt="" hidden>
                    <input type="text" class="person-dropdown-input" placeholder="Bitte wählen" autocomplete="off">
                </div>
                <div class="person-dropdown-panel" hidden>
                    <ul class="person-dropdown-list" role="listbox"></ul>
                    <button type="button" class="person-dropdown-add">+ Neue Person hinzufügen</button>
                </div>
            </div>
        </template>

        <script type="module" src="app.js"></script>        
    </body>

</html>
