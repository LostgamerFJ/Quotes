<!DOCTYPE html>
<html>
    <head>
        <title>Zitate</title>
        <link rel="icon" type="image/png" href="assets/Icon.png">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <button type="button" class="collapsible">
            <img src="./assets/Portrait_Placeholder.png" height="50">
        </button>
        <div class="content">
            <p>Test</p>
        </div>

        <button id="openBtn">Neues Zitat</button>

        <div class="overlay" id="overlay">
            <div class="popup">
                <h2>Neues Zitat</h2>
        
                <div class="field-row">
                    <div class="field">
                        <label>Person</label>
                        <div class="person-dropdown-slot" id="personSlot"></div>
                    </div>
                    <div class="field">
                        <label for="Notes">Notiz</label>
                        <input type="text" id="Notes" placeholder="Optional">
                    </div>
                    <div class="field field-wide">
                        <label for="Quote">Zitat</label>
                        <input type="text" id="Quote">
                    </div>
                    <div class="field">
                        <label for="Context">Kontext</label>
                        <input type="text" id="Context" placeholder="Optional">
                    </div>
                </div>
        
                <div class="left-action">
                    <button class="btn-secondary" id="extraFieldBtn">+ Weitere Zeile</button>
                </div>
        
                <div class="popup-footer">
                    <button class="btn-close-x" id="closeXBtn" aria-label="Schließen">Abbrechen</button>
                    <button class="btn-primary" id="saveBtn">Speichern</button>
                </div>
            </div>
        </div>

        <button id="saveAllBtn">Speichern</button>

        <script type="module" src="app.js"></script>        
    </body>

</html>
