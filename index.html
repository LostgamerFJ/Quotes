<!DOCTYPE html>
<html>
    <head>
        <title>Zitate</title>
        <link rel="icon" type="image/png" href="assets/Icon.png">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <button type="button" class="collapsible">
            <img src="./assets/Portrait_Placeholder.png" height="50">
        </button>
        <div class="content">
            <p>Test</p>
        </div>

        <button id="openBtn">Neues Zitat</button>

        <div class="overlay" id="overlay">
            <div class="quote-popup" id="quote-popup">
                <h2>Neues Zitat</h2>
        
                <div class="field-row"></div>
        
                <div class="left-action">
                    <button class="btn-secondary" id="extraFieldBtn">+ Weitere Zeile</button>
                </div>
        
                <div class="quote-popup-footer">
                    <button class="btn-reset" id="resetBtn">Zurücksetzen</button>
                    <button class="btn-close-x" id="closeXBtn" aria-label="Schließen">Abbrechen</button>
                    <button class="btn-primary" id="saveBtn">Speichern</button>
                </div>
            </div>
        </div>

        <button id="saveAllBtn">Speichern</button>

        <script type="module" src="app.js"></script>        
    </body>

</html>
